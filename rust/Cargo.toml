[workspace]
resolver = "3"
members = ["rutube-core", "rutube-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0"

[workspace.dependencies]
itertools = "0.15.0"
rutube-core = { path = "rutube-core" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
