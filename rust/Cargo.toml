[workspace]
resolver = "3"
members = [
    "rutube-core",
    "rutube-cli",
    "rutube-ffi",
    "uniffi-bindgen",
    "vendor/ts-to-mp4",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0"

[workspace.dependencies]
itertools = "0.15.0"
thiserror = "2.0.20"
ts-to-mp4 = { path = "vendor/ts-to-mp4" }
rutube-core = { path = "rutube-core" }
uniffi = "0.32.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
